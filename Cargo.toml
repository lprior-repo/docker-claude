[package]
name = "claude-dock"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
colored = "3"
keyring = { version = "3", features = ["linux-native"] }
which = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
